    body {

    .item{

  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(10px);

  border-radius: 20px;

  padding: 18px;

  margin-top: 15px;

  border: 1px solid rgba(255,255,255,0.1);

  box-shadow:
  0 8px 25px rgba(0,0,0,0.25);

  transition: 0.3s;

}
.item:hover{

  transform: translateY(-5px);

  box-shadow:
  0 12px 30px rgba(0,0,0,0.35);

}
    .item:hover {
      transform: scale(1.02);
    }

    .item.fade-out {
      opacity: 0;
      transform: translateX(30px);
    }

    .item button {
      width: auto;
      padding: 5px 10px;
      margin-top: 6px;
      margin-right: 5px;
      font-size: 12px;
    }

    .dashboard{

  display: grid;

  grid-template-columns:
  repeat(auto-fit,minmax(280px,1fr));

  gap: 20px;

  margin-top: 25px;

}
#urgente .item,
#iaRecetas .item{

  background:
  linear-gradient(
    135deg,
    rgba(0,198,255,0.15),
    rgba(0,114,255,0.15)
  );

  border:
  1px solid rgba(255,255,255,0.1);

}
.item{

  animation: aparecer 0.5s ease;

}
@keyframes aparecer{

  from{

    opacity: 0;

    transform:
    translateY(20px)
    scale(0.95);

  }

  to{

    opacity: 1;

    transform:
    translateY(0)
    scale(1);

  }

}
button{

  position: relative;

  overflow: hidden;

}
button::before{

  content: "";

  position: absolute;

  top: 0;

  left: -100%;

  width: 100%;

  height: 100%;

  background:
  linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.3),
    transparent
  );

  transition: 0.5s;

}
button:hover::before{

  left: 100%;

}
@keyframes mensaje{

  from{

    opacity: 0;

    transform:
    translateX(20px);

  }

  to{

    opacity: 1;

    transform:
    translateX(0);

  }

}
input,select{

  transition: 0.3s;

}
input:focus,
select:focus{

  outline: none;

  transform: scale(1.02);

  box-shadow:
  0 0 15px rgba(0,198,255,0.5);

}

  translateY(-8px);
